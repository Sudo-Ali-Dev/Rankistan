name: Deploy to GitHub Pages

# The only workflow that deploys Pages. It runs on every push to main, and is
# dispatched by update-digest.yml each time a batch saves the board. Either
# way it builds the latest code with the latest state from the
# `pipeline-state` release, so a code push ships the newest data and a data
# update ships the newest code.
#
# There used to be two deployers, this and the pipeline, and they raced: a
# merge minutes before a pipeline publish could redeploy older data.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every run deploys the newest code and the newest state, so a newer run
  # supersedes an older one outright and the older one is cancelled. That also
  # means no run can hold this group for long: the October 2026 outage was a
  # run held at the github-pages environment gate for eight days, in a group
  # that cancelled nothing.
  # Not `pages-deploy`: that group held a run stuck at the environment gate
  # for eight days from 2026-10-05, displacing 190 runs. A fresh name owes
  # nothing to whatever GitHub may still associate with the old one.
  group: pages-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/data.json is not in git. Fails the build rather than deploying
      # a site with no board when there is no readable state.
      - name: Download the latest board
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/state-store.js pull public/data.json

      - name: Build
        env:
          VITE_SUMMARY_API_URL: ${{ vars.VITE_SUMMARY_API_URL || 'https://rankistan-summary-api.academics-ali.workers.dev' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The only job with the environment and the Pages permissions, and short:
  # it waits on nothing but the deployment itself.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      # Falls back to the retry step's URL when the first attempt failed.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      # A cancelled run's deployment can still be finishing when the run that
      # superseded it deploys, which deploy-pages refuses.
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
