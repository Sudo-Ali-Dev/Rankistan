name: Update Leaderboard

# One batch of the leaderboard: load the board from the `pipeline-state`
# release, measure this batch, merge it in, check the result, save it as the
# new newest state, and dispatch deploy.yml to publish it. See
# scripts/run-all.js for the flow and scripts/state-store.js for the store.
#
# This job neither commits to main nor deploys Pages. It used to do both: a
# data commit every hour (98.4% of the repository's packed size), a
# five-attempt push retry with a replay of the batch onto whatever main had
# become, and a Pages deployment of its own that raced deploy.yml's. With one
# serialized writer and a single deployer, none of that is needed.

on:
  # Primary trigger: cron-job.org dispatches at the top of every hour. External
  # dispatches are immune to GitHub's 60-day auto-disable of scheduled
  # workflows, which is why it stays primary.
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch index (0-23), leave empty to auto-detect from current hour"
        required: false
        default: ""
  # No `schedule` here, deliberately: GitHub disables a scheduled workflow
  # after 60 days without repository activity, and a disabled workflow cannot
  # be dispatched. The backup trigger lives in pipeline-backup.yml instead,
  # which dispatches this one when cron-job.org has not.

# The repository default is read-only; this is everything the job does.
permissions:
  # The release that holds the state: create it, upload a state asset, prune
  # old ones. Releases have no narrower scope than contents.
  contents: write
  # workflow_dispatch of deploy.yml and watchdog.yml after the save, the one
  # event GITHUB_TOKEN may start a workflow with, and the read of their state
  # beforehand: a disabled one fails this run.
  actions: write
  # The registration and opt-out issues, read every run (scripts/registry.js).
  # A run that cannot read them saves nothing.
  issues: read

concurrency:
  # Renamed from `pages-deploy` on 2026-10-13. Run 37313510144, dispatched at
  # 13:00 UTC on 2026-10-05, created its Pages deployment and then stopped at
  # the github-pages environment gate without ever getting a runner. A run held
  # at a gate still counts as running, so the group admitted nothing else: each
  # of the next 190 hourly dispatches sat `pending`, waited an hour, and was
  # displaced by the one after. Eight days of stale data, and nothing failed,
  # because a displaced run concludes `cancelled`.
  #
  # The job no longer deploys and has no `environment:`, so it cannot be held
  # at that gate again. This group is now also what makes the job the single
  # writer of the state: runs are serialized, never cancelled, so no two load
  # and save the board at once.
  group: leaderboard-pipeline
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Karachi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The tip, not `github.sha`. A dispatched run pins to the SHA the
          # branch had when it was queued, and this job routinely waits ~20
          # minutes behind the previous batch before it starts - so it began on
          # a commit that was already one batch stale, every time.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Determine batch index
        id: batch
        # The dispatch input arrives via env, not spliced into the script body.
        # Interpolating ${{ }} directly into run: is the shape that becomes a
        # script-injection bug the moment a trigger with untrusted input is
        # added. workflow_dispatch requires write access today, so this is
        # hardening rather than a live fix.
        env:
          INPUT_BATCH: ${{ github.event.inputs.batch }}
        run: |
          if [ -n "$INPUT_BATCH" ]; then
            echo "index=$INPUT_BATCH" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%-H)
            INDEX=$(( (HOUR + 5) % 24 ))
            echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          fi
          echo "Batch index: $(grep index "$GITHUB_OUTPUT" | tail -1)"

      # Refuses to save, and so to deploy, a board that fails verify:published
      # or that loses more than 5% of its developers with no recorded reason.
      # During a scoring-model migration, set the repository variable
      # ALLOW_MIXED_MODELS=1 until all 24 batches have run under the new model,
      # and remove it after.
      - name: Run the batch and save the state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_INDEX: ${{ steps.batch.outputs.index }}
          ALLOW_MIXED_MODELS: ${{ vars.ALLOW_MIXED_MODELS }}
        run: node scripts/run-all.js --incremental "$BATCH_INDEX" --state release
