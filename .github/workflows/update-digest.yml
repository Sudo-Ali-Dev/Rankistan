name: Update Leaderboard

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch index (0-23), leave empty to auto-detect from current hour"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # deploy.yml declares this; this job deploys Pages too but did not,
    # which is a likely contributor to the deploy flakiness the retry
    # steps below work around.
    environment:
      name: github-pages
    env:
      TZ: Asia/Karachi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Determine batch index
        id: batch
        # The dispatch input arrives via env, not spliced into the script body.
        # Interpolating ${{ }} directly into run: is the shape that becomes a
        # script-injection bug the moment a trigger with untrusted input is
        # added. workflow_dispatch requires write access today, so this is
        # hardening rather than a live fix.
        env:
          INPUT_BATCH: ${{ github.event.inputs.batch }}
        run: |
          if [ -n "$INPUT_BATCH" ]; then
            echo "index=$INPUT_BATCH" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%-H)
            INDEX=$(( (HOUR + 5) % 24 ))
            echo "index=$INDEX" >> "$GITHUB_OUTPUT"
          fi
          echo "Batch index: $(grep index "$GITHUB_OUTPUT" | tail -1)"

      - name: Run incremental pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_INDEX: ${{ steps.batch.outputs.index }}
        run: |
          BATCH="$BATCH_INDEX"
          echo "Running incremental batch: $BATCH"
          node scripts/run-all.js --incremental "$BATCH"

      - name: Commit and push updates
        env:
          BATCH_INDEX: ${{ steps.batch.outputs.index }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- public/data.json; then
            echo "No leaderboard changes to commit."
            exit 0
          fi

          git add public/data.json
          git commit -m "chore: update leaderboard (batch $BATCH_INDEX)"

          if git push origin HEAD:main; then
            exit 0
          fi

          echo "Push rejected because main moved. Rebasing onto latest origin/main and retrying."
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          VITE_SUMMARY_API_URL: ${{ vars.VITE_SUMMARY_API_URL || 'https://rankistan-summary-api.academics-ali.workers.dev' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
