name: CI

# Nothing gated main before this: neither deploy.yml nor update-digest.yml runs
# lint or tests, and no PR in the repo's history has ever had a status check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Boots the built bundle in a DOM and asserts the app mounts. Added
      # after a react/react-dom mismatch took the site down while build and
      # all tests passed - nothing here had ever loaded the app.
      - name: Smoke test the build
        run: npm run smoke

  # Guards the pipeline's own logic without touching GitHub or public/data.json.
  pipeline-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify activity scoring invariants
        run: npm run verify:activity

      - name: Pipeline dry run (no GitHub calls, writes gitignored output)
        run: node scripts/run-all.js --incremental 0 --dry-run
