name: CI

# Nothing gated main before this: neither deploy.yml nor update-digest.yml runs
# lint or tests, and no PR in the repo's history has ever had a status check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/data.json is not in git: the live board lives on the
      # `pipeline-state` release (scripts/state-store.js). CI builds and checks
      # a committed 50-row sample instead, so no result here depends on live
      # data or on the network.
      - name: Use the committed sample board
        run: cp fixtures/data.sample.json public/data.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Boots the built bundle in a DOM and asserts the app mounts. Added
      # after a react/react-dom mismatch took the site down while build and
      # all tests passed - nothing here had ever loaded the app.
      - name: Smoke test the build
        run: npm run smoke

  # Guards the pipeline's own logic without touching GitHub or live data.
  pipeline-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the committed sample board
        run: cp fixtures/data.sample.json public/data.json

      # Recomputes every row of the sample from its measurement, and checks the
      # board is in the model's order with equal scores sharing a rank.
      - name: Verify the sample leaderboard against the scoring model
        run: npm run verify:published

      # Replays batch 0 of the sample through the real merge and guards,
      # writing gitignored output.
      - name: Pipeline dry run (no GitHub calls)
        run: node scripts/run-all.js --incremental 0 --dry-run

      # The board the dry run wrote, checked the same way the pipeline checks a
      # board before saving it.
      - name: Verify the dry run's board
        run: node scripts/verify-published.js public/data.dry-run.json
