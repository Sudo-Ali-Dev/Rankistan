name = "rankistan-summary-api"
main = "worker.js"
compatibility_date = "2026-04-03"

[vars]
SUMMARY_ALLOWED_ORIGIN = "https://rankistan.dev,https://www.rankistan.dev,https://sudo-ali-dev.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"

# The pipeline's clock, which does not depend on GitHub's scheduler: no `schedule` trigger fired
# in this repository from 2026-04-03 until a single, 35-minute-late run on 2026-10-13. At :00 it dispatches the pipeline; at :35 the backup
# trigger (which starts the pipeline only if no run covered the hour) and the watchdog. Needs the
# secret GITHUB_DISPATCH_TOKEN: a fine-grained token for this repository only, Actions read and
# write. See scheduled.js; /api/health (health.js) is what an outside monitor polls.
[triggers]
crons = ["0 * * * *", "35 * * * *"]

# Rate limiting for /api/dev-summary.
#
# A Durable Object is used because Cloudflare guarantees a single instance per
# object ID and serialises requests to it, so keying by client IP gives one
# authoritative counter per IP with no races. That is what a rate limit needs.
#
# The two previous approaches are recorded in rate-limiter.js: a module-level
# Map (per-isolate, so a sequential caller was never counted - the original
# report in #65) and Cloudflare's [[ratelimits]] binding, which measured as
# ineffective here: it returned success for 30 consecutive requests against a
# 20/60s config, and for 10 against a 3/60s config.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"
script_name = "rankistan-summary-api"

# SQLite-backed Durable Objects are available without a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# The score preview (/api/score-preview/:login, score-preview.js) keeps one measured result per
# login until the Pakistan date turns over. The Cache API does nothing on *.workers.dev, so the
# cache is a Durable Object too. Reads with the secret GITHUB_PREVIEW_TOKEN when set (a
# fine-grained token with public read only), else GITHUB_DISPATCH_TOKEN; never the pipeline's.
[[durable_objects.bindings]]
name = "PREVIEW_CACHE"
class_name = "PreviewCache"
script_name = "rankistan-summary-api"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PreviewCache"]
