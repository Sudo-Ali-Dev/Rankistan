    <!--
      GitHub Pages answers a path it has no file for with 404.html, and a developer's own page
      (rankistan.dev/username) is such a path when the developer is not on the board. That page
      keeps the path it was asked for and sends the visitor to the root; this puts it back before
      the app mounts, so the app reads the path and shows what it names. It runs before the
      analytics boot below, so the page view is counted under the path the visitor asked for and
      not under the root. The key is removed as it is read, so a later visit to the root is not
      sent somewhere else.
    -->
    <script id="rankistan-path-restore">
      (function () {
        try {
          var stored = sessionStorage.getItem('rankistan:path');
          if (stored && stored !== window.location.pathname) {
            sessionStorage.removeItem('rankistan:path');
            window.history.replaceState(null, '', stored);
          }
        } catch (error) {
          /* No storage: the path stays what the server sent. */
        }
      })();
    </script>

    <!--
      Cloudflare Web Analytics: cookieless, no personal data, no fingerprinting. Docs:
      docs/analytics.md. It records paths and referrers but never query strings, so a UTM link
      landing on / is rewritten here, before the beacon reads the URL, to a path it can see:
      /?utm_source=linkedin&utm_campaign=infra-1  ->  /from/linkedin/infra-1
      Only utm_source and utm_campaign are read, reduced to [a-z0-9-_] and 40 characters; the
      other utm_* parameters are dropped, and everything else in the URL is kept. The beacon
      loads only on rankistan.dev, so local development and tests send nothing.
    -->
    <script id="analytics-boot">
      (function () {
        var CF_WEB_ANALYTICS_TOKEN = '857e190fa40e40de94cf522ddbabbf1e';
        var HOST = 'rankistan.dev';
        try {
          var loc = window.location;
          var params = new URLSearchParams(loc.search);
          var clean = function (value) {
            return String(value || '').toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
          };
          var source = clean(params.get('utm_source'));
          if (source && (loc.pathname === '/' || loc.pathname === '/index.html')) {
            var campaign = clean(params.get('utm_campaign')) || 'none';
            Array.from(params.keys()).forEach(function (key) {
              if (/^utm_/i.test(key)) params.delete(key);
            });
            var rest = params.toString();
            window.history.replaceState(null, '', '/from/' + source + '/' + campaign + (rest ? '?' + rest : '') + loc.hash);
          }
          if (CF_WEB_ANALYTICS_TOKEN && loc.hostname === HOST) {
            var beacon = document.createElement('script');
            beacon.defer = true;
            beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
            beacon.setAttribute('data-cf-beacon', JSON.stringify({ token: CF_WEB_ANALYTICS_TOKEN, spa: true }));
            document.head.appendChild(beacon);
          }
        } catch (error) {
          /* Analytics must never break the page. */
        }
      })();
    </script>
